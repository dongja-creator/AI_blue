<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>청렴 신고 사건 조회</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#172b4d;font-family:system-ui,"Noto Sans KR",sans-serif}header{background:linear-gradient(120deg,#102d59,#1d5ca8);color:white;padding:36px 20px}.wrap{max-width:1120px;width:calc(100% - 36px);margin:auto}h1{font-size:clamp(28px,4vw,38px);margin:8px 0}header p{color:#dce9ff}.stats,.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stats{margin:24px 0}.stat,.panel,.case{background:#fff;border:1px solid #e1e8f0;border-radius:15px;padding:17px;box-shadow:0 3px 12px #15345a08}.stat small,.meta small,.sub{color:#66758a}.stat strong{display:block;font-size:24px;margin-top:5px}.panel{margin-bottom:24px;padding:22px}h2{font-size:21px;margin:0 0 5px}.sub{font-size:13px}.filters{display:grid;grid-template-columns:1fr 1fr 1.2fr auto;gap:10px}select,input,button{min-height:44px;border-radius:10px;padding:0 12px;font:inherit}select,input{border:1px solid #ccd7e5;background:white;min-width:0}button{background:#174ea6;color:white;border:0;font-weight:700;cursor:pointer}.result{font-weight:800;color:#174ea6;margin:18px 0 12px}.casehead{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}.id{font-size:11px;color:#66758a}.pill{font-size:11px;background:#eaf2ff;color:#174ea6;padding:5px 9px;border-radius:20px;font-weight:700}.case h3{font-size:17px;margin:0 0 13px}.meta{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #edf1f6;padding-top:12px;gap:8px}.meta small{display:block;font-size:11px}.meta b{font-size:13px}.empty{grid-column:1/-1;text-align:center;padding:32px;border:1px dashed #ccd7e5;border-radius:12px;color:#66758a}.rss{display:grid;grid-template-columns:1fr 1fr;gap:10px}.news{display:flex;gap:12px;border:1px solid #e1e8f0;border-radius:12px;padding:14px;text-decoration:none;color:inherit}.date{font-size:11px;color:#66758a;white-space:nowrap}.newstitle{font-size:13px;font-weight:600;line-height:1.6}footer{border-top:1px solid #e1e8f0;padding:20px 0;color:#66758a;font-size:12px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}.filters input,.filters button{grid-column:1/-1}.rss{grid-template-columns:1fr}}@media(max-width:520px){.cards,.stats{grid-template-columns:1fr}.panel{padding:16px}}
</style></head><body><header><div class="wrap"><small>CITIZEN INTEGRITY SERVICE</small><h1>청렴 신고 사건 조회</h1><p>신고 사건 처리 현황과 행정안전부의 최신 정책 소식을 확인하세요.</p></div></header><main class="wrap"><div class="stats"><div class="stat"><small>전체 신고 사건</small><strong id="total">-</strong></div><div class="stat"><small>현재 검색 결과</small><strong id="shown">-</strong></div><div class="stat"><small>데이터 기준</small><strong>제공자료</strong></div></div><section class="panel"><h2>신고 사건 찾기</h2><p class="sub">신고유형·처리상태를 필터링하고 지역 또는 사건 ID를 검색합니다.</p><div class="filters"><select id="type"><option value="">전체 신고유형</option></select><select id="status"><option value="">전체 처리상태</option></select><input id="q" placeholder="지역 또는 사건 ID 검색"><button id="search">검색</button></div><div class="result" id="count">결과 0건</div><div id="cards" class="cards"></div></section><section class="panel"><h2>행정안전부 최신 보도자료</h2><p class="sub">행정·공공서비스 정책 동향 원문 링크</p><div id="rss" class="rss">불러오는 중…</div><p class="sub">출처: <a href="https://www.mois.go.kr/gpms/view/jsp/rss/rss.jsp?ctxCd=1012" target="_blank" rel="noopener">행정안전부 보도자료 RSS</a> · <span id="rssstate">연계 중</span></p></section></main><footer><div class="wrap">제공된 사건 데이터 기반의 정적 조회 서비스이며 실제 신고 접수 또는 공식 사건조회 시스템이 아닙니다.</div></footer><script>
let data=[];const $=id=>document.getElementById(id),esc=s=>String(s??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function opts(id,vals){[...new Set(vals.filter(Boolean))].sort().forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;$(id).appendChild(o)})}function render(){let t=$('type').value,s=$('status').value,q=$('q').value.trim().toLowerCase(),a=data.filter(x=>(!t||x['신고유형']===t)&&(!s||x['처리상태']===s)&&(!q||String(x['지역']).toLowerCase().includes(q)||String(x['사건ID']).toLowerCase().includes(q))).sort((x,y)=>String(y['신고일자']).localeCompare(String(x['신고일자'])));$('count').textContent=`결과 ${a.length}건`;$('shown').textContent=a.length.toLocaleString()+'건';$('cards').innerHTML=a.length?a.map(x=>`<article class="case"><div class="casehead"><span class="id">${esc(x['사건ID'])}</span><span class="pill">${esc(x['신고유형'])}</span></div><h3>${esc(x['지역'])} · 청렴 신고</h3><div class="meta"><div><small>신고일자</small><b>${esc(x['신고일자'])}</b></div><div><small>처리상태</small><b>${esc(x['처리상태'])}</b></div></div></article>`).join(''):'<div class="empty">조건에 맞는 사건이 없습니다.</div>'}async function init(){try{let r=await fetch('./data/cases.json');data=await r.json();$('total').textContent=data.length.toLocaleString()+'건';opts('type',data.map(x=>x['신고유형']));opts('status',data.map(x=>x['처리상태']));render()}catch(e){$('cards').innerHTML='<div class="empty">사건 데이터를 불러오지 못했습니다.</div>'}}function news(items,live){$('rss').innerHTML=items.slice(0,10).map(x=>`<a class="news" href="${esc(x.link)}" target="_blank" rel="noopener"><span class="date">${esc(x.date)}</span><span class="newstitle">${esc(x.title)} ↗</span></a>`).join('');$('rssstate').textContent=live?'RSS 실시간 조회 성공':'저장된 RSS 항목 표시'}async function loadNews(){try{let r=await fetch('/.netlify/functions/rss');if(!r.ok)throw 0;let d=await r.json();if(!d.items?.length)throw 0;news(d.items,true)}catch(e){let r=await fetch('./data/rss-snapshot.json');news(await r.json(),false)}}$('search').onclick=render;$('q').onkeydown=e=>{if(e.key==='Enter')render()};$('type').onchange=render;$('status').onchange=render;init();loadNews();
</script></body></html>
